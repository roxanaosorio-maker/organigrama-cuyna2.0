<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Organigrama Cuyna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --magenta:#840C56;
    --orange:#E29513;
    --darkgrey:#434343;
    --nearblack:#1A1A1A;
    --wine:#5C1030;
    --espresso:#7A4E3D;
    --rust:#A8721E;
    --terracotta:#B5502E;
    --teal:#2F6F63;
    --lightbg:#F4F5F5;
    --textdark:#2B2B2B;
    --muted:#8A8A8A;
    --line:#C7CBCC;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--lightbg); color:var(--textdark);
    font-family:'Montserrat',sans-serif; font-weight:400;
  }
  h1,h2,h3,.bold{font-weight:700;}
  /* ---------- HERO ---------- */
  .hero{
    position:relative; overflow:hidden; color:#fff; padding:28px 44px 46px;
    background:
      radial-gradient(circle at 82% 15%, rgba(226,149,19,.55), transparent 55%),
      radial-gradient(circle at 60% -10%, rgba(226,149,19,.20), transparent 45%),
      radial-gradient(circle at 30% 90%, rgba(226,149,19,.25), transparent 50%),
      linear-gradient(135deg, #6d0f45 0%, #840C56 55%, #7a2a4f 100%);
  }
  .hero-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .hero-top img{height:30px; display:block;}
  .tagline{font-size:12px; opacity:.85; margin-top:6px;}
  .hero-meta{text-align:right; font-size:12px; opacity:.85; line-height:1.6;}
  .hero-meta b{font-weight:700; opacity:1;}
  .hero-divider{border:none; border-top:1px solid rgba(255,255,255,.35); margin:16px 0 34px;}
  .hero-title{font-size:40px; font-weight:800; line-height:1.12; margin:0 0 14px;}
  .hero-sub{font-size:15px; opacity:.9;}
  .hero-sub b{font-weight:700;}

  /* ---------- STATS ---------- */
  .stats{
    display:flex; gap:56px; padding:26px 44px; background:#fff;
    border-bottom:1px solid #E3E5E5; flex-wrap:wrap;
  }
  .stat-n{font-size:30px; font-weight:800; color:var(--magenta); line-height:1;}
  .stat-l{font-size:12px; color:var(--muted); margin-top:4px; max-width:200px;}

  /* ---------- CHART SECTION ---------- */
  .chart-wrap{padding:40px 20px 70px; overflow-x:auto;}
  .chart-head{max-width:1200px; margin:0 auto 30px; padding:0 24px;}
  .chart-head .dash{width:30px; height:4px; background:var(--magenta); margin-bottom:10px;}
  .chart-head h2{font-size:24px; margin:0 0 4px;}
  .chart-head p{margin:0; font-size:13px; color:var(--muted); font-style:italic;}
  .hint{font-size:12px; color:var(--muted); margin-top:10px;}
  .hint b{color:var(--magenta);}

  .culture-banner{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:18px;
    margin:0 44px 34px; padding:22px 30px; border-radius:16px;
    background:linear-gradient(120deg, #840C56 0%, #B5502E 55%, #E29513 100%);
    box-shadow:0 8px 24px rgba(132,12,86,.25);
  }
  .culture-banner-left{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .gptw-badge{height:60px; width:auto; display:block; background:#fff; border-radius:10px; padding:6px;}
  .culture-banner-text{display:flex; flex-direction:column; gap:3px; color:#fff;}
  .culture-banner-text strong{font-size:16px; font-weight:800; letter-spacing:.2px;}
  .culture-banner-text span{font-size:12.5px; opacity:.92;}
  .culture-btn{
    display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--magenta);
    text-decoration:none; font-weight:800; font-size:13.5px; padding:12px 24px; border-radius:26px;
    white-space:nowrap; transition:transform .15s, box-shadow .15s; box-shadow:0 3px 10px rgba(0,0,0,.18);
  }
  .culture-btn:hover{transform:translateY(-2px) scale(1.03); box-shadow:0 6px 18px rgba(0,0,0,.22);}

  #treeRoot{position:relative; display:flex; justify-content:flex-start; padding-left:10px;}
  .branch{display:flex; flex-direction:column; align-items:center; position:relative;}
  .children{display:flex; flex-direction:row; gap:10px; margin-top:34px; align-items:flex-start;}
  .children.grid2{display:grid; grid-template-columns:repeat(2, min-content); gap:10px 14px;}

  .node{
    border-radius:8px; padding:9px 12px; cursor:default; user-select:none;
    min-width:120px; text-align:center; position:relative; z-index:2;
  }
  .node .lbl{font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; opacity:.9; display:block; margin-bottom:3px;}
  .node .nm{font-size:12.5px; font-weight:700; line-height:1.25;}

  .node.ceo{background:var(--magenta); color:#fff; min-width:200px;}

  .node.pill{
    padding:6px 16px; border-radius:20px; font-size:10px; font-weight:700;
    letter-spacing:.5px; text-transform:uppercase; min-width:auto;
  }
  .pill-fin{background:var(--espresso); color:#fff;}
  .pill-peo{background:var(--orange); color:#fff;}
  .pill-sup{background:var(--teal); color:#fff;}
  .pill-rev{background:var(--rust); color:#fff;}
  .pill-ops{background:var(--terracotta); color:#fff;}

  .node.branchtag{
    padding:6px 16px; border-radius:14px; font-size:9.5px; font-weight:700;
    letter-spacing:.4px; text-transform:uppercase; background:#fff; color:var(--terracotta);
    border:1.5px solid var(--terracotta); min-width:auto;
  }
  .node.branchtag .tag-line{display:block;}
  .node.branchtag .tag-divider{display:block; height:1px; background:var(--terracotta); opacity:.4; margin:4px 2px;}

  .node.person{
    background:var(--card); border:1.5px solid #E3E5E5; transition:box-shadow .15s, transform .15s;
  }
  .node.person.clickable:hover{box-shadow:0 4px 14px rgba(0,0,0,.12); transform:translateY(-1px); border-color:var(--magenta);}
  .node.person .lbl{color:var(--muted);}
  .node.person.head{border-width:2px;}

  .node.person.fin{border-color:var(--espresso);}
  .node.person.peo{border-color:var(--orange);}
  .node.person.sup{border-color:var(--teal);}
  .node.person.rev{border-color:var(--rust);}
  .node.person.ops{border-color:var(--terracotta);}

  svg#lines{position:absolute; top:0; left:0; overflow:visible; pointer-events:none; z-index:1;}

  /* ---------- DETAIL PANEL ---------- */
  #overlay{
    position:fixed; inset:0; background:rgba(20,20,20,.45); opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:10;
  }
  #overlay.show{opacity:1; pointer-events:auto;}
  #panel{
    position:fixed; top:0; right:-420px; width:400px; height:100%; background:#fff;
    box-shadow:-8px 0 30px rgba(0,0,0,.15); transition:right .25s ease; z-index:11;
    display:flex; flex-direction:column;
  }
  #panel.show{right:0;}
  .panel-top{background:var(--wine); color:#fff; padding:26px 26px 22px; position:relative;}
  .panel-close{
    position:absolute; top:16px; right:18px; background:none; border:none; color:#fff;
    font-size:20px; cursor:pointer; opacity:.8; line-height:1;
  }
  .panel-close:hover{opacity:1;}
  .panel-logo{height:15px; display:block; margin-bottom:20px; opacity:.9;}
  .panel-avatar{
    width:104px; height:104px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:27px; font-weight:700; color:#fff; margin-bottom:14px; overflow:hidden;
    background-size:cover; background-position:center; box-shadow:0 0 0 3px rgba(255,255,255,.18);
  }
  .panel-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .panel-badge{
    display:inline-block; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    padding:4px 10px; border-radius:20px; margin-bottom:12px;
  }
  .panel-top h3{margin:0 0 4px; font-size:20px; font-weight:700;}
  .panel-top .role{font-size:13px; opacity:.85;}
  .panel-top .meta{font-size:11.5px; opacity:.7; margin-top:10px; line-height:1.6;}
  .panel-body{padding:22px 26px; overflow-y:auto; flex:1;}
  .panel-body h4{
    font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
    margin:0 0 12px;
  }
  .panel-body ul{margin:0; padding:0 0 0 18px;}
  .panel-body li{font-size:13px; line-height:1.55; margin-bottom:9px;}
  .panel-sites-row{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .panel-sites-label{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700;}
  .panel-sites{display:flex; flex-wrap:wrap; gap:7px;}
  .site-chip{background:#fff; border:1.5px solid; border-radius:14px; padding:4px 12px; font-size:11.5px; font-weight:700;}
  .panel-bio{
    margin:0 0 22px; padding:14px 16px; background:#FAF7F5; border-radius:8px; font-size:12.5px; color:var(--textdark);
    border-left:3px solid var(--orange);
  }
  .panel-bio p{margin:0 0 10px; line-height:1.5;}
  .panel-bio p:last-child{margin-bottom:0;}
  .panel-bio b{color:var(--magenta);}
  .panel-foot{
    padding:14px 26px; border-top:1px solid #eee; font-size:10.5px; color:var(--muted); font-style:italic;
  }

  footer{padding:22px 44px; font-size:11px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}

  .hero-top{position:relative; z-index:12;}
  .lang-toggle{display:inline-flex; background:rgba(255,255,255,.16); border-radius:20px; padding:3px; margin-bottom:10px;}
  .lang-btn{border:none; background:transparent; color:#fff; opacity:.75; font-family:'Montserrat',sans-serif; font-weight:700; font-size:11px; letter-spacing:.5px; padding:5px 14px; border-radius:16px; cursor:pointer; transition:background .15s, opacity .15s;}
  .lang-btn:hover{opacity:1;}
  .lang-btn.active{background:#fff; color:var(--magenta); opacity:1;}
  .panel-avatar.logo-avatar{padding:0;}
  .panel-avatar.logo-avatar img{width:60%; height:auto; object-fit:contain; display:block;}
  .node-logo-badge{width:100%; height:100%; object-fit:contain;}
</style>
</head>

const byId = {}; NODES.forEach(n => byId[n.id] = n);
const childrenOf = id => NODES.filter(n => n.manager === id);
const ROOT_ID = NODES.find(n => n.manager === null || n.manager === undefined).id;

function nearestPersonManagerName(node){
  let cur = byId[node.manager];
  while(cur){
    if(cur.role) return cur.name;
    cur = byId[cur.manager];
  }
  return '—';
}

function renderNode(node){
  const kids = childrenOf(node.id);
  const wrap = document.createElement('div');
  wrap.className = 'branch';

  const el = document.createElement('div');
  el.className = 'node ' + node.type;
  el.dataset.id = node.id;

  const nameText = getText(node.name);
  const roleText = node.role !== undefined ? getText(node.role) : undefined;

  if(roleText !== undefined){
    const displayName = node.type === 'ceo' ? nameText : nameText.replace(/\s+(\S+)$/, '<br>$1');
    const lblHtml = roleText ? '<span class="lbl">'+roleText+'</span>' : '';
    el.innerHTML = lblHtml+'<span class="nm">'+displayName+'</span>';
  } else if(node.type === 'branchtag' && nameText.includes(' / ')){
    const parts = nameText.split(' / ');
    el.innerHTML = '<span class="tag-line">'+parts[0]+'</span><span class="tag-divider"></span><span class="tag-line">'+parts[1]+'</span>';
  } else {
    el.innerHTML = nameText;
  }

  if(node.roleKey){
    el.classList.add('clickable');
    el.addEventListener('click', () => openPanel(node));
  }
  wrap.appendChild(el);

  if(kids.length){
    const row = document.createElement('div');
    row.className = 'children' + (node.layout === 'grid2' ? ' grid2' : '');
    kids.forEach(k => row.appendChild(renderNode(k)));
    wrap.appendChild(row);
  }
  return wrap;
}

const root = document.getElementById('treeRoot');

/* ---- draw connector lines ---- */
function drawLines(){
  const old = document.getElementById('lines');
  if(old) old.remove();
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('id','lines');
  const rootRect = root.getBoundingClientRect();
  svg.style.width = root.scrollWidth + 'px';
  svg.style.height = root.scrollHeight + 'px';
  root.appendChild(svg);

  NODES.forEach(n => {
    if(!n.manager) return;
    const childEl = root.querySelector('[data-id="'+n.id+'"]');
    const parentEl = root.querySelector('[data-id="'+n.manager+'"]');
    if(!childEl || !parentEl) return;
    const c = childEl.getBoundingClientRect();
    const p = parentEl.getBoundingClientRect();
    const round = v => Math.round(v * 2) / 2; // snap to nearest half-pixel to avoid sub-pixel seams
    const cx = round(c.left + c.width/2 - rootRect.left);
    const cy = round(c.top - rootRect.top);
    const px = round(p.left + p.width/2 - rootRect.left);
    const py = round(p.bottom - rootRect.top);
    const midY = round(py + (cy - py) / 2);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M ${px} ${py} L ${px} ${midY} L ${cx} ${midY} L ${cx} ${cy}`);
    path.setAttribute('fill','none');
    path.setAttribute('stroke','#B7BBBC');
    path.setAttribute('stroke-width','1.5');
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('stroke-linejoin','round');
    path.setAttribute('shape-rendering','geometricPrecision');
    svg.appendChild(path);
  });
}
window.addEventListener('resize', drawLines);
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(drawLines); }

/* ---- detail panel ---- */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function openPanel(node){
  const role = ROLES[node.roleKey];
  const deptColor = DEPT_COLOR[node.dept] || '#840C56';

  document.getElementById('pName').textContent = getText(node.name);
  document.getElementById('pRole').textContent = role ? role.title[LANG] : getText(node.role);

  const avatar = document.getElementById('pAvatar');
  avatar.style.background = deptColor;
  avatar.innerHTML = '<img src="data:image/png;base64,'+LOGO_B64+'" alt="cuyna">';

  const badge = document.getElementById('pBadge');
  badge.textContent = (DEPT_LABEL[node.dept] && DEPT_LABEL[node.dept][LANG]) || '';
  badge.style.background = deptColor;

  document.getElementById('pMeta').innerHTML = node.manager ? (PANEL_I18N.reportsTo[LANG]+'<b>'+nearestPersonManagerName(node)+'</b>') : '';

  const sitesWrap = document.getElementById('pSitesWrap');
  const sites = SITES[node.id];
  const SITE_COLORS = ['#840C56','#7A4E3D','#E29513','#2F6F63','#A8721E','#B5502E'];
  if(sites && sites.length){
    sitesWrap.style.display = 'flex';
    document.getElementById('pSitesLabel').textContent = PANEL_I18N.leads[LANG];
    document.getElementById('pSites').innerHTML = sites.map((s,i) => {
      const c = SITE_COLORS[i % SITE_COLORS.length];
      return '<span class="site-chip" style="border-color:'+c+'; color:'+c+';">'+escapeHtml(s)+'</span>';
    }).join('');
  } else {
    sitesWrap.style.display = 'none';
  }

  const ul = document.getElementById('pFunctions');
  ul.innerHTML = '';
  (role ? role.fn[LANG] : []).forEach(f => {
    const li = document.createElement('li');
    li.textContent = f;
    ul.appendChild(li);
  });
  document.getElementById('pFoot').textContent = PANEL_I18N.panelFoot[LANG];
  document.getElementById('panel').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closePanel(){
  document.getElementById('panel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', closePanel);

/* ---- language toggle ---- */
function setLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.title = DOC_TITLE[lang];
  document.getElementById('btnEs').classList.toggle('active', lang === 'es');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if(I18N[key]) el.innerHTML = I18N[key][lang];
  });
  closePanel();
  root.innerHTML = '';
  root.appendChild(renderNode(byId[ROOT_ID]));
  setTimeout(drawLines, 30);
}

document.getElementById('statPeople').textContent = NODES.filter(n => n.roleKey).length;
document.getElementById('statDept').textContent = Object.keys(DEPT_LABEL).length;

setLang('es');
window.addEventListener('load', drawLines);
</script>
